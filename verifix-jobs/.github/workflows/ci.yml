name: CI/CD

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/verifix-jobs

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifix-jobs
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: verifix_jobs_test
          POSTGRES_USER: verifix
          POSTGRES_PASSWORD: ci_test_password_2026
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U verifix" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build & Test
        run: chmod +x mvnw && ./mvnw -B verify
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: verifix_jobs_test
          POSTGRES_USER: verifix
          POSTGRES_PASSWORD: ci_test_password_2026
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-jwt-secret-not-for-production-use-only
          KAFKA_ENABLED: false
          ELASTICSEARCH_ENABLED: false
          MINIO_ENABLED: false
          ML_SERVICE_ENABLED: false
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-reports, path: "verifix-jobs/**/target/surefire-reports/", retention-days: 14 }

  ml-service:
    name: ML Service Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifix-jobs/verifix-jobs-ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m grpc_tools.protoc -I app/proto --python_out=app/proto --grpc_python_out=app/proto app/proto/ml_service.proto
      - run: python -m pytest tests/ -v --tb=short

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scan
        run: docker build -f verifix-jobs/verifix-jobs-api/Dockerfile -t scan:latest verifix-jobs
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  docker-push:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend, ml-service]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build & Push API
        run: |
          docker build -f verifix-jobs/verifix-jobs-api/Dockerfile \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }} \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}-api:latest verifix-jobs
          docker push ghcr.io/${{ env.IMAGE_PREFIX }}-api --all-tags
      - name: Build & Push Telegram
        run: |
          docker build -f verifix-jobs/verifix-jobs-telegram/Dockerfile \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}-telegram:${{ github.sha }} \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}-telegram:latest verifix-jobs
          docker push ghcr.io/${{ env.IMAGE_PREFIX }}-telegram --all-tags
      - name: Build & Push ML
        run: |
          docker build -f verifix-jobs/verifix-jobs-ml/Dockerfile \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}-ml:${{ github.sha }} \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}-ml:latest verifix-jobs/verifix-jobs-ml
          docker push ghcr.io/${{ env.IMAGE_PREFIX }}-ml --all-tags
      - name: Build & Push Public Web
        run: |
          docker build -f verifix-jobs/verifix-jobs-web/Dockerfile \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}-web:${{ github.sha }} \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}-web:latest verifix-jobs/verifix-jobs-web
          docker push ghcr.io/${{ env.IMAGE_PREFIX }}-web --all-tags
      - name: Build & Push Standalone Admin
        run: |
          docker build -f verifix-jobs/verifix-jobs-admin/Dockerfile \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}-admin:${{ github.sha }} \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}-admin:latest verifix-jobs/verifix-jobs-admin
          docker push ghcr.io/${{ env.IMAGE_PREFIX }}-admin --all-tags

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [docker-push, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/verifix/verifix-jobs
            git pull origin main
            bash ops/validate-env.sh .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
            sleep 15
            curl -skf https://jobs.verifix.uz && echo "OK" || echo "WARN: public health check pending"
