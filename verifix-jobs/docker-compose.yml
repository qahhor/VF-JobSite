services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: verifix-jobs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verifix_jobs}
      POSTGRES_USER: ${POSTGRES_USER:-verifix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verifix_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verifix} -d ${POSTGRES_DB:-verifix_jobs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: verifix-jobs-redis
    command: redis-server ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: verifix-jobs-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: verifix-jobs-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: verifix-jobs-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: verifix-jobs-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: verifix-jobs-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: verifix-jobs-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.5.2
    container_name: verifix-jobs-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards

  # ---- Application services ----

  api:
    build:
      context: .
      dockerfile: verifix-jobs-api/Dockerfile
    image: verifix-jobs-api:latest
    container_name: verifix-jobs-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://verifix-jobs-postgres:5432/${POSTGRES_DB:-verifix_jobs}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-verifix}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-verifix_secret}
      SPRING_DATA_REDIS_HOST: verifix-jobs-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_ELASTICSEARCH_URIS: http://verifix-jobs-elasticsearch:9200
      SPRING_KAFKA_BOOTSTRAP_SERVERS: verifix-jobs-kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: http://verifix-jobs-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  telegram:
    build:
      context: .
      dockerfile: verifix-jobs-telegram/Dockerfile
    image: verifix-jobs-telegram:latest
    container_name: verifix-jobs-telegram
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://verifix-jobs-postgres:5432/${POSTGRES_DB:-verifix_jobs}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-verifix}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-verifix_secret}
      SPRING_DATA_REDIS_HOST: verifix-jobs-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: verifix-jobs-kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://verifix-jobs-elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-false}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      MINIO_ENABLED: ${MINIO_ENABLED:-false}
    ports:
      - "${TELEGRAM_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  ml-service:
    build:
      context: ./verifix-jobs-ml
      dockerfile: Dockerfile
    image: verifix-jobs-ml:latest
    container_name: verifix-jobs-ml
    ports:
      - "${ML_API_PORT:-8000}:8000"
      - "${ML_GRPC_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  zookeeper-data:
  kafka-data:
  es-data:
  minio-data:
  grafana-data:
