[databases]
verifix_jobs = host=postgres port=5432 dbname=verifix_jobs

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 50
max_client_conn = 500
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3
server_lifetime = 600
server_idle_timeout = 300
log_connections = 0
log_disconnections = 0
stats_period = 60
