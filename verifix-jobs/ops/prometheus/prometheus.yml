global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: "verifix-jobs-api"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["verifix-jobs-api:8080"]
    # Fallback for local dev (uncomment if needed):
    # static_configs:
    #   - targets: ["host.docker.internal:8080"]

  - job_name: "verifix-jobs-telegram"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["verifix-jobs-telegram:8081"]

  - job_name: "verifix-jobs-ml"
    metrics_path: /health
    scrape_interval: 60s
    static_configs:
      - targets: ["verifix-jobs-ml:8000"]

  - job_name: "postgres"
    static_configs:
      - targets: ["verifix-jobs-postgres:5432"]

  - job_name: "redis"
    static_configs:
      - targets: ["verifix-jobs-redis:6379"]
