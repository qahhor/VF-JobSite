groups:
  - name: verifix-jobs-critical
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} не отвечает"
          description: "Сервис {{ $labels.job }} недоступен более 2 минут"

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Высокий уровень ошибок 5xx (>5%)"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "P95 время ответа >2 секунд"

  - name: verifix-jobs-infra
    rules:
      - alert: DatabaseConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "Пул подключений к БД заполнен на >90%"

      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "JVM heap использование >85%"

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Свободное место на диске <15%"

  - name: verifix-jobs-business
    rules:
      - alert: NoApplicationsReceived
        expr: increase(http_server_requests_seconds_count{uri=~".*applications.*",method="POST"}[1h]) == 0
        for: 2h
        labels: { severity: warning }
        annotations:
          summary: "Нет новых заявок за 2 часа (рабочее время)"

      - alert: SMSGatewayFailing
        expr: rate(sms_send_failures_total[15m]) > 0.3
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "SMS шлюз — более 30% сбоев"
