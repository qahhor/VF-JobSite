# =====================================================
# PRODUCTION OVERRIDES — Tuned for 1000 concurrent users
# DAU: 100,000 | MAU: 1,200,000
# =====================================================

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Tuning for 75 connection pool
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1536MB
      POSTGRES_MAX_CONNECTIONS: 200
    restart: always
    deploy:
      resources:
        limits: { memory: 4G, cpus: '4.0' }
    logging: { driver: json-file, options: { max-size: "100m", max-file: "10" } }

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru --tcp-backlog 511 --hz 10
    restart: always
    deploy:
      resources:
        limits: { memory: 1536M, cpus: '1.0' }

  zookeeper:
    restart: always
    deploy:
      resources:
        limits: { memory: 768M, cpus: '0.5' }
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 3

  kafka:
    restart: always
    deploy:
      resources:
        limits: { memory: 2G, cpus: '2.0' }
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  elasticsearch:
    environment:
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    restart: always
    deploy:
      resources:
        limits: { memory: 4G, cpus: '2.0' }
    logging: { driver: json-file, options: { max-size: "100m", max-file: "5" } }

  kibana:
    environment:
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    restart: always
    deploy:
      resources:
        limits: { memory: 1G, cpus: '1.0' }

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    restart: always
    deploy:
      resources:
        limits: { memory: 1G, cpus: '1.0' }

  ml-service:
    restart: always
    deploy:
      resources:
        limits: { memory: 2G, cpus: '2.0' }

  prometheus:
    restart: always
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://monitoring.jobs.verifix.uz
    restart: always

  nginx:
    image: nginx:1.27-alpine
    container_name: verifix-jobs-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - postgres
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: { driver: json-file, options: { max-size: "50m", max-file: "10" } }
